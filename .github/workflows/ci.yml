name: CI

on:
  pull_request:
  push:
    branches: [master, release_init]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: flutter pub get
      # Errors and warnings fail the build; infos (generated code) do not.
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      # Proves the release configuration builds (signed with the debug key here).
      - run: flutter build apk --release --split-per-abi
